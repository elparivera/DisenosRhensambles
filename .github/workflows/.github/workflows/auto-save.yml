name: Auto Save

# ────────────────
# Disparadores
# ────────────────
on:
  push:
    branches:
      - main        # se ejecuta en cada commit a main
  schedule:
    - cron: '0 * * * *'   # se ejecuta cada hora
  workflow_dispatch:       # permite lanzarlo manualmente desde Actions

# ────────────────
# Permisos
# ────────────────
permissions:
  contents: write   # 🔑 necesario para hacer commits y push

# ────────────────
# Jobs
# ────────────────
jobs:
  auto-commit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ✅ fuerza Node.js 24 desde ya

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repo
        uses: actions/checkout@v4   # versión actualizada

      # 2. Configuración de Git
      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      # 3. Commit y push automático
      - name: Commit changes
        run: |
          git add .
          git commit -m "Auto-save changes [skip ci]" || echo "No changes to commit"
          git push

      # 4. Subida de artefactos (logs, etc.)
      - name: Upload logs
        uses: actions/upload-artifact@v4   # versión actualizada
        with:
          name: auto-save-logs
          path: .
