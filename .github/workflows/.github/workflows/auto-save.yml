name: Auto Save

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'  # cada hora

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-save changes" || echo "No changes"
          git push
