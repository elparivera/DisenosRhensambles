name: Auto Save

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'  # Cada 30 minutos

jobs:
  auto-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Commit Changes
        run: |
          git config --global user.name 'AutoSaveBot'
          git config --global user.email 'autosave@github.com'
          
          if [[ `git status --porcelain` ]]; then
            git add .
            git commit -m "Auto-save: cambios guardados automáticamente en $(date)"
            git push origin main
          else
            echo 'Sin cambios pendientes'
          fi
